<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>

    <style>
        p {
            margin-left: 15px;
            color: white;
        }

        h3 {
            margin-left: 150px;
        }
    </style>
</head>

<body>
    <div style="margin-left: 200px; background-color: blueviolet; border: 2px solid red; width: 600px; height: 580px;">

        <center>
            <h2 style="color: white; line-height: 50px;"><img
                    src="https://img.magnific.com/free-vector/school-bus-transport_24877-83090.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="" height="50px" width="50px" style="border-radius: 50%; "> Bus Booking
                System</h2>
        </center>
        <h3>User Information</h3>
        <p>User Name: <input type="text"></p>
        <p>User Age: <input type="text"></p>
        <p>Aadhar No: <input type="text"></p>
        <p>Select Your City: <select name="" id="">
                <option value="">GZB</option>
                <option value="">Delhi</option>
                <option value="">Kanpur</option>
                <option value="">Goa</option>
                <option value="">Meerut</option>
            </select> </p>
        <p>Select your Traveling Date: <input type="date"> </p>

        <h3>Bus Information</h3>
        <p>Select your Bus Type:</p>
        <p>AC Bus:2000 <input type="radio" id="a1" name="ad" value="a11"> </p>
        <p> NON AC Bus:1000 <input type="radio" id="a1" name="ad" value="a11"> </p>
        <p>Select your Sheet: <select name="" id="">
                <option value="">1</option>
                <option value="">2</option>
                <option value="">3</option>
                <option value="">4</option>
                <option value="">5</option>
            </select></p>
        <br>
        <button>Click For Save</button>




    </div>
</body>

</html>
